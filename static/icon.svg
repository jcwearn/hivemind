<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="hivemind">
  <rect width="32" height="32" rx="6" fill="#07090c"/>
  <!-- A snake drawn on the same grid the game uses: three body cells, a bright
       head, and the apple it is going for. -->
  <g fill="#1c6b42">
    <rect x="6" y="18" width="5" height="5" rx="1"/>
    <rect x="11" y="18" width="5" height="5" rx="1"/>
    <rect x="16" y="18" width="5" height="5" rx="1"/>
    <rect x="16" y="13" width="5" height="5" rx="1"/>
  </g>
  <rect x="16" y="8" width="5" height="5" rx="1" fill="#3ddc84"/>
  <circle cx="9" cy="10" r="2.5" fill="#ff5d5d"/>
</svg>
